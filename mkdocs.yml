site_name: AI Text Summarizer
site_description: A microservice for summarizing text using AI
site_author: Dipesh Kumar Chaudhary

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking

nav:
  - Home: index.md
  - API Reference: api.md
  - Development: development.md
  - Deployment: deployment.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - admonition

plugins:
  - search
